{{ define "content" }}
<div class="max-w-6xl mx-auto space-y-6">
    <div>
        <h1 class="text-3xl font-bold text-gray-800">User Administration</h1>
        <p class="text-gray-600">Manage local users and role assignments.</p>
    </div>

    <div class="bg-white rounded-lg shadow-md p-6">
        <h2 class="text-xl font-semibold text-gray-800 mb-4">Create User</h2>
        <form hx-post="{{.BasePath}}/admin/users/new" class="grid grid-cols-1 md:grid-cols-4 gap-3" hx-target="this" hx-swap="none">
            <input name="username" type="text" required placeholder="Username" class="px-3 py-2 border border-gray-300 rounded-lg" />
            <input name="password" type="password" required placeholder="Password" class="px-3 py-2 border border-gray-300 rounded-lg" />
            <select name="role" class="px-3 py-2 border border-gray-300 rounded-lg">
                <option value="viewer">viewer</option>
                <option value="operator">operator</option>
                <option value="admin">admin</option>
            </select>
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg px-4 py-2">Create</button>
        </form>
    </div>

    <div class="bg-white rounded-lg shadow-md overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Username</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Role</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Enabled</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-200">
                {{range .Users}}
                <tr>
                    <td class="px-4 py-3 text-sm text-gray-800">{{.Username}}</td>
                    <td class="px-4 py-3">
                        <form hx-post="{{$.BasePath}}/admin/users/{{.ID}}/role" hx-target="this" hx-swap="none" class="flex items-center gap-2">
                            <select name="role" class="px-2 py-1 border border-gray-300 rounded">
                                <option value="viewer" {{if eq .Role "viewer"}}selected{{end}}>viewer</option>
                                <option value="operator" {{if eq .Role "operator"}}selected{{end}}>operator</option>
                                <option value="admin" {{if eq .Role "admin"}}selected{{end}}>admin</option>
                            </select>
                            <button class="text-indigo-600 hover:text-indigo-800 text-sm" type="submit">Save</button>
                        </form>
                    </td>
                    <td class="px-4 py-3 text-sm {{if .Enabled}}text-green-700{{else}}text-red-700{{end}}">{{if .Enabled}}yes{{else}}no{{end}}</td>
                    <td class="px-4 py-3">
                        <form hx-post="{{$.BasePath}}/admin/users/{{.ID}}/enabled" hx-target="this" hx-swap="none">
                            <input type="hidden" name="enabled" value="{{if .Enabled}}false{{else}}true{{end}}" />
                            <button type="submit" class="text-sm {{if .Enabled}}text-red-600 hover:text-red-800{{else}}text-green-600 hover:text-green-800{{end}}">
                                {{if .Enabled}}Disable{{else}}Enable{{end}}
                            </button>
                        </form>
                    </td>
                </tr>
                {{end}}
            </tbody>
        </table>
    </div>
</div>
{{ end }}
