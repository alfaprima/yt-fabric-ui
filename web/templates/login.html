{{ define "content" }}
<div class="max-w-md mx-auto">
    <div class="bg-white rounded-lg shadow-md p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Login</h1>

        {{if .Error}}
        <div class="mb-4 p-3 rounded bg-red-50 border border-red-200 text-red-700 text-sm">{{.Error}}</div>
        {{end}}

        <form method="post" action="{{.BasePath}}/login" class="space-y-4">
            <input type="hidden" name="next" value="{{.Next}}">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" for="username">Username</label>
                <input id="username" name="username" type="text" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent" />
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" for="password">Password</label>
                <input id="password" name="password" type="password" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent" />
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-lg">Sign in</button>
        </form>
    </div>
</div>
{{ end }}
